apiVersion: v1
kind: ConfigMap
metadata:
  name: finsecure-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  finsecure-pay.json: |
    {"title":"FinSecure Pay","uid":"finsecure-pay","schemaVersion":39,"refresh":"10s","time":{"from":"now-30m","to":"now"},"panels":[{"id":1,"type":"stat","title":"Available replicas","gridPos":{"h":6,"w":6,"x":0,"y":0},"targets":[{"expr":"kube_deployment_status_replicas_available{deployment=\"finsecure-pay\"}","refId":"A"}]},{"id":2,"type":"timeseries","title":"Requests per second","gridPos":{"h":8,"w":9,"x":6,"y":0},"targets":[{"expr":"sum(rate(http_server_requests_seconds_count{job=\"finsecure-pay\"}[1m])) by (uri)","legendFormat":"{{uri}}","refId":"A"}]},{"id":3,"type":"timeseries","title":"Validation results per minute","gridPos":{"h":8,"w":9,"x":15,"y":0},"targets":[{"expr":"sum(increase(finsecure_validation_total[1m])) by (result)","legendFormat":"{{result}}","refId":"A"}]},{"id":4,"type":"timeseries","title":"JVM heap used (MiB)","gridPos":{"h":8,"w":12,"x":0,"y":8},"targets":[{"expr":"sum(jvm_memory_used_bytes{job=\"finsecure-pay\",area=\"heap\"}) by (pod) / 1024 / 1024","legendFormat":"{{pod}}","refId":"A"}]},{"id":5,"type":"timeseries","title":"Pod CPU (cores)","gridPos":{"h":8,"w":12,"x":12,"y":8},"targets":[{"expr":"sum(rate(container_cpu_usage_seconds_total{namespace=\"default\",pod=~\"finsecure-pay.*\",container!=\"\"}[2m])) by (pod)","legendFormat":"{{pod}}","refId":"A"}]}]}